<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Endereço atualizado — Kleber Carboni</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:#06090f;color:#e9eef5;padding:24px;
  }
  main{max-width:520px}
  h1{font-size:clamp(2.6rem,10vw,4.4rem);margin:0 0 6px;letter-spacing:-.04em;color:#07d4ad}
  h2{font-size:1.15rem;margin:0 0 14px}
  p{color:#9db0c6;line-height:1.6;margin:0 0 22px}
  a{
    display:inline-block;padding:12px 22px;border-radius:11px;text-decoration:none;
    font-weight:700;font-size:.95rem;color:#06090f;background:#07d4ad;transition:.16s;
  }
  a:hover{filter:brightness(1.08)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#2ee6c5}
</style>
<script>
(function(){
  var p = (location.pathname || '').toLowerCase();
  if(p.indexOf('/portfolio') === 0){ location.replace(location.origin + '/'); }
})();
</script>
</head>
<body>
<main>
  <h1>404</h1>
  <h2>O endereço do portfólio mudou</h2>
  <p>Este projeto agora fica na raiz do domínio: <code>kleberherlon.github.io</code>.</p>
  <a href="/">Ir para o portfólio</a>
</main>
</body>
</html>
